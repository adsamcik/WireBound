name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PROJECT_PATH: src/WireBound.Avalonia/WireBound.Avalonia.csproj

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - runtime: win-x64
            os: windows-latest
            archive: zip
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
            version="${version#v}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish build
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }} \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Publish elevation helper
        run: |
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            helper_project="src/WireBound.Elevation.Windows/WireBound.Elevation.Windows.csproj"
          else
            helper_project="src/WireBound.Elevation.Linux/WireBound.Elevation.Linux.csproj"
          fi
          dotnet publish "$helper_project" \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }} \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Validate published startup
        run: |
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            executable="./publish/${{ matrix.runtime }}/WireBound.exe"
          else
            executable="./publish/${{ matrix.runtime }}/WireBound"
          fi
          "$executable" --startup-check

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Download previous Velopack release
        # Velopack auto-generates a delta when a previous full release already
        # exists in the pack's --outputDir, so download it there directly
        # (there is no --previous flag on `vpk pack`; see docs.velopack.io/packaging/deltas).
        run: dotnet tool run vpk -- download github --repoUrl https://github.com/adsamcik/WireBound --channel ${{ matrix.runtime }} -o ./velopack/${{ matrix.runtime }}
        continue-on-error: true

      - name: Package with Velopack (Windows)
        if: matrix.runtime == 'win-x64'
        # Keep the explicit platform directive even on the native Windows runner
        # so local and CI packaging select the same Velopack target.
        run: |
          dotnet tool run vpk -- '[win]' pack -u WireBound -v ${{ steps.version.outputs.VERSION }} \
            -p ./publish/${{ matrix.runtime }} \
            -o ./velopack/${{ matrix.runtime }} \
            -e WireBound.exe \
            --channel ${{ matrix.runtime }} \
            --packTitle WireBound \
            --packAuthors WireBound \
            --icon ./src/WireBound.Avalonia/Assets/wirebound.ico \
            --instWelcome ./installer/windows/welcome.txt \
            --instReadme ./installer/windows/readme.md \
            --instConclusion ./installer/windows/conclusion.txt

      - name: Package with Velopack (Linux)
        if: matrix.runtime == 'linux-x64'
        run: |
          dotnet tool run vpk -- '[linux]' pack -u WireBound -v ${{ steps.version.outputs.VERSION }} \
            -p ./publish/${{ matrix.runtime }} \
            -o ./velopack/${{ matrix.runtime }} \
            -e WireBound \
            --channel ${{ matrix.runtime }} \
            --packTitle WireBound \
            --packAuthors WireBound \
            --icon ./src/WireBound.Avalonia/Assets/wirebound-512.png

      - name: Validate Velopack package
        shell: pwsh
        run: >
          ./scripts/test-velopack-package.ps1
          -OutputDirectory ./velopack/${{ matrix.runtime }}
          -Runtime ${{ matrix.runtime }}
          -Version ${{ steps.version.outputs.VERSION }}

      - name: Upload Velopack artifact
        # Uploading the Velopack package to GitHub Releases happens later, in the
        # single sequential `release` job, to avoid both matrix legs racing to
        # create/merge a release for the same tag at the same time.
        uses: actions/upload-artifact@v7
        with:
          name: Velopack-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}
          path: ./velopack/${{ matrix.runtime }}
          retention-days: 30
          if-no-files-found: error

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: >
          Compress-Archive
          -Path ./publish/${{ matrix.runtime }}/*
          -DestinationPath ./WireBound-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}.zip

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./publish/${{ matrix.runtime }}
          tar -czvf "../../WireBound-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: WireBound-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}
          path: ./WireBound-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}.${{ matrix.archive }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
            version="${version#v}"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: WireBound-*

      - name: Generate release notes
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          cat > release-notes.md << EOF
          ## WireBound v$version
          
          ### Downloads
          - **Windows installer (recommended)**: \`WireBound-win-x64-Setup.exe\` - install once, then update from inside WireBound
          - **Linux AppImage (recommended)**: \`WireBound-linux-x64.AppImage\` - make executable and run
          - **Windows portable**: \`WireBound-$version-win-x64.zip\` - extract and run \`WireBound.exe\`
          - **Linux portable**: \`WireBound-$version-linux-x64.tar.gz\` - extract and run \`WireBound\`
          
          ### System Requirements
          - Linux / Windows 10+
          - Self-contained (no runtime required)
          
          ### What's New
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: WireBound v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          # Keep the release private until both Velopack channels upload
          # successfully. A packaging/upload failure must never expose a
          # release that installed builds cannot update to.
          draft: true
          prerelease: ${{ inputs.prerelease || false }}
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Download Velopack artifact (win-x64)
        # Downloaded by exact name (not `pattern`) into an explicit per-runtime
        # directory, so the destination path is always known regardless of
        # whether zero, one, or both runtime artifacts exist — download-artifact@v8
        # only extracts directly into a matched `pattern`'s named subdirectory
        # when 2+ artifacts match; with exactly 1 match it flattens into the
        # shared root, which broke path lookups below when only one leg produced
        # a Velopack package.
        uses: actions/download-artifact@v8
        with:
          name: Velopack-${{ steps.version.outputs.VERSION }}-win-x64
          path: ./velopack-artifacts/win-x64

      - name: Download Velopack artifact (linux-x64)
        uses: actions/download-artifact@v8
        with:
          name: Velopack-${{ steps.version.outputs.VERSION }}-linux-x64
          path: ./velopack-artifacts/linux-x64

      - name: Upload Velopack packages to GitHub Release
        # Runs sequentially (one leg after the other, both within this single
        # job) after the release above already exists, so `--merge true` always
        # merges into a stable target instead of racing two parallel matrix
        # legs to create/merge the same tag's release simultaneously.
        run: |
          for runtime in win-x64 linux-x64; do
            dir="./velopack-artifacts/$runtime"
            test -d "$dir" && test -n "$(ls -A "$dir")"
            dotnet tool run vpk -- upload github \
              --repoUrl https://github.com/adsamcik/WireBound \
              --tag v${{ steps.version.outputs.VERSION }} \
              --token ${{ secrets.GITHUB_TOKEN }} \
              --channel "$runtime" \
              --merge true \
              -o "$dir"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated GitHub Release
        run: gh release edit v${{ steps.version.outputs.VERSION }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
