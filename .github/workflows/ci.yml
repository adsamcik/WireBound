name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore WireBound.slnx

      - name: Build
        run: dotnet build WireBound.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet exec tests/WireBound.Tests/bin/Release/net10.0/WireBound.Tests.dll --report-trx --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore WireBound.slnx

      - name: Check formatting
        run: dotnet format WireBound.slnx --verify-no-changes --verbosity diagnostic --exclude-diagnostics TUnit0018 CA1416 IL2046 IL2026 IL3050

  publish-validation:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            name: Linux
            os: ubuntu-latest
          - runtime: win-x64
            name: Windows
            os: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish ${{ matrix.name }} build
        run: |
          dotnet publish src/WireBound.Avalonia/WireBound.Avalonia.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }}

      - name: Publish elevation helper
        run: |
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            helper_project="src/WireBound.Elevation.Windows/WireBound.Elevation.Windows.csproj"
          else
            helper_project="src/WireBound.Elevation.Linux/WireBound.Elevation.Linux.csproj"
          fi
          dotnet publish "$helper_project" \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }}

      - name: Validate build artifacts
        run: |
          OUTPUT_DIR="./publish/${{ matrix.runtime }}"
          if [ "${{ matrix.runtime }}" == "win-x64" ]; then
            EXE_NAME="WireBound.exe"
          else
            EXE_NAME="WireBound"
          fi
          
          if [ ! -f "$OUTPUT_DIR/$EXE_NAME" ]; then
            echo "❌ Executable not found: $OUTPUT_DIR/$EXE_NAME"
            exit 1
          fi
          
          SIZE=$(du -h "$OUTPUT_DIR/$EXE_NAME" | cut -f1)
          echo "✅ Executable found: $SIZE"
          
          FILE_COUNT=$(find "$OUTPUT_DIR" -type f | wc -l)
          TOTAL_SIZE=$(du -sh "$OUTPUT_DIR" | cut -f1)
          echo ""
          echo "📊 Build Summary (${{ matrix.name }}):"
          echo "   Files: $FILE_COUNT"
          echo "   Total Size: $TOTAL_SIZE"

          "$OUTPUT_DIR/$EXE_NAME" --startup-check

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Package Windows installer
        if: matrix.runtime == 'win-x64'
        run: |
          dotnet tool run vpk -- '[win]' pack -u WireBound -v 0.0.${{ github.run_number }} \
            -p ./publish/${{ matrix.runtime }} \
            -o ./velopack/${{ matrix.runtime }} \
            -e WireBound.exe \
            --channel ${{ matrix.runtime }} \
            --packTitle WireBound \
            --packAuthors WireBound \
            --icon ./src/WireBound.Avalonia/Assets/wirebound.ico \
            --instWelcome ./installer/windows/welcome.txt \
            --instReadme ./installer/windows/readme.md \
            --instConclusion ./installer/windows/conclusion.txt

      - name: Package Linux AppImage
        if: matrix.runtime == 'linux-x64'
        run: |
          dotnet tool run vpk -- '[linux]' pack -u WireBound -v 0.0.${{ github.run_number }} \
            -p ./publish/${{ matrix.runtime }} \
            -o ./velopack/${{ matrix.runtime }} \
            -e WireBound \
            --channel ${{ matrix.runtime }} \
            --packTitle WireBound \
            --packAuthors WireBound \
            --icon ./src/WireBound.Avalonia/Assets/wirebound-512.png

      - name: Validate Velopack package
        shell: pwsh
        run: >
          ./scripts/test-velopack-package.ps1
          -OutputDirectory ./velopack/${{ matrix.runtime }}
          -Runtime ${{ matrix.runtime }}
          -Version 0.0.${{ github.run_number }}

  aot-validation:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            name: Linux
            exe: WireBound
            elevation_project: src/WireBound.Elevation.Linux/WireBound.Elevation.Linux.csproj
          - os: windows-latest
            runtime: win-x64
            name: Windows
            exe: WireBound.exe
            elevation_project: src/WireBound.Elevation.Windows/WireBound.Elevation.Windows.csproj
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: AOT Publish main app (${{ matrix.name }})
        run: >
          dotnet publish src/WireBound.Avalonia/WireBound.Avalonia.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output ./publish/aot/${{ matrix.runtime }}

      - name: AOT Publish elevation helper (${{ matrix.name }})
        run: >
          dotnet publish ${{ matrix.elevation_project }}
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish/aot/${{ matrix.runtime }}

      - name: Validate AOT artifacts
        shell: bash
        run: |
          OUTPUT_DIR="./publish/aot/${{ matrix.runtime }}"

          if [ ! -f "$OUTPUT_DIR/${{ matrix.exe }}" ]; then
            echo "❌ AOT executable not found: $OUTPUT_DIR/${{ matrix.exe }}"
            exit 1
          fi

          SIZE=$(du -h "$OUTPUT_DIR/${{ matrix.exe }}" | cut -f1)
          echo "✅ AOT executable found: $SIZE"

          FILE_COUNT=$(find "$OUTPUT_DIR" -type f | wc -l)
          TOTAL_SIZE=$(du -sh "$OUTPUT_DIR" | cut -f1)
          echo ""
          echo "📊 AOT Build Summary (${{ matrix.name }}):"
          echo "   Files: $FILE_COUNT"
          echo "   Total Size: $TOTAL_SIZE"

          "$OUTPUT_DIR/${{ matrix.exe }}" --startup-check
